plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.abnamro.apps.referenceandroid'
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.abnamro.apps.referenceandroid"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        animationsDisabled = true
   }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    
    // Kaspresso and Kakao for UI testing
    androidTestImplementation 'com.kaspersky.android-components:kaspresso:1.6.0'
    androidTestImplementation 'io.github.kakaocup:kakao:3.7.0'
    
    // Android Test Orchestrator for parallel test execution
    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}

// Task to open test report after tests complete
tasks.register('openTestReport') {
    group = 'verification'
    description = 'Opens the enhanced test report in browser'
    dependsOn 'enhanceTestReport'
    doLast {
        def reportFile = file("${layout.buildDirectory.get()}/reports/androidTests/connected/debug/index.html")
        if (reportFile.exists()) {
            println "Opening test report: ${reportFile.absolutePath}"
            try {
                def os = org.gradle.internal.os.OperatingSystem.current()
                def command
                if (os.isWindows()) {
                    command = ['cmd', '/c', 'start', '', reportFile.absolutePath]
                } else if (os.isMacOsX()) {
                    command = ['open', reportFile.absolutePath]
                } else {
                    command = ['xdg-open', reportFile.absolutePath]
                }
                def process = new ProcessBuilder(command).start()
                process.waitFor()
            } catch (Exception e) {
                println "Warning: Could not open report automatically: ${e.message}"
                println "Please open manually: ${reportFile.absolutePath}"
            }
        } else {
            println ""
            println "═══════════════════════════════════════════════════════════════"
            println "⚠️  Test report not found!"
            println "═══════════════════════════════════════════════════════════════"
            println ""
            println "Expected location: ${reportFile.absolutePath}"
            println ""
            println "To generate the report, run tests first:"
            println "  PowerShell: .\\gradlew.bat connectedDebugAndroidTest"
            println "  CMD:        gradlew.bat connectedDebugAndroidTest"
            println "  Linux/Mac:  ./gradlew connectedDebugAndroidTest"
            println ""
            println "Or run tests from Android Studio, then run this task again."
            println ""
        }
    }
}

// Combined task: enhance report and open it
tasks.register('viewTestReport') {
    group = 'verification'
    description = 'Enhances test report with Kaspresso steps and opens it in browser'
    dependsOn 'enhanceTestReport', 'openTestReport'
}

// Ensure tasks are visible in Android Studio
tasks.configureEach { task ->
    if (task.name in ['enhanceTestReport', 'openTestReport', 'viewTestReport']) {
        task.group = 'verification'
    }
}

// Task to enhance HTML report with Kaspresso step information
tasks.register('enhanceTestReport') {
    group = 'verification'
    description = 'Extracts Kaspresso steps from logs and adds them to HTML report'
    doLast {
        def reportDir = file("${layout.buildDirectory.get()}/reports/androidTests/connected/debug")
        def testResultsDir = file("${layout.buildDirectory.get()}/outputs/androidTest-results/connected/debug")

        // Map to collect all tests grouped by class: className -> [testMethodName -> steps]
        def testsByClass = [:]

        // Find logcat files and collect all test data
        testResultsDir.eachDir { deviceDir ->
            deviceDir.eachFileMatch(~/logcat-.*\.txt/) { logcatFile ->
                def logcatContent = logcatFile.text

                // Extract step information with hierarchy tracking
                def stepStack = []  // Stack to track nested steps
                def allSteps = []   // Flat list of all steps with hierarchy info

                logcatContent.eachLine { line ->
                    // Match start of step - more specific regex to avoid matching SUCCEED/FAILED lines
                    if (line.contains('TEST STEP:') && !line.contains('SUCCEED') && !line.contains('FAILED') && !line.contains('finished')) {
                        // Regex to capture the step name, optionally stripping existing "1. " or "1.1. " numbering
                        def stepMatch = line =~ /TEST STEP: "(?:\d+(?:\.\d+)*\.\s+)?(.+?)"/
                        if (stepMatch) {
                            def stepName = stepMatch[0][1]
                            def step = [
                                    name      : stepName,
                                    status    : 'RUNNING',
                                    duration  : '',
                                    screenshot: '',
                                    children  : []
                            ]

                            if (!stepStack.isEmpty()) {
                                stepStack.last().children.add(step)
                            } else {
                                allSteps.add(step)
                            }
                            stepStack.push(step)
                        }
                    }
                    // Match end of step
                    else if (line.contains('SUCCEED') || line.contains('FAILED')) {
                        def status = line.contains('SUCCEED') ? 'SUCCEED' : 'FAILED'
                        def durationMatch = line =~ /(?:SUCCEED|FAILED)\. It took (.+?)\./
                        if (durationMatch && !stepStack.isEmpty()) {
                            def currentStep = stepStack.pop()
                            currentStep.status = status
                            currentStep.duration = durationMatch[0][1]
                        }
                    }
                    // Match screenshot logs - look for screenshot file paths in log
                    else if (line.toLowerCase().contains('screenshot') && (line.contains('.png') || line.contains('.jpg') || line.contains('.jpeg'))) {
                        def pathMatch = line =~ /([\/\\].*?\.(png|jpg|jpeg))/
                        if (pathMatch && !stepStack.isEmpty()) {
                            stepStack.last().screenshot = pathMatch[0][1]
                        }
                    }
                }

                // Deduplicate steps (same name at same level)
                def deduplicatedSteps = deduplicateSteps(allSteps)

                // Store test data grouped by class
                if (deduplicatedSteps.size() > 0) {
                    def filenameMatch = logcatFile.name =~ /logcat-(.+?)-(.+?)\.txt/
                    if (filenameMatch) {
                        def className = filenameMatch[0][1]
                        def testMethodName = filenameMatch[0][2]

                        if (!testsByClass.containsKey(className)) {
                            testsByClass[className] = [:]
                        }
                        testsByClass[className][testMethodName] = deduplicatedSteps
                    }
                }
            }
        }

        // Helper function to format method name to readable format
        def formatMethodName = { methodName ->
            // Convert camelCase to "Title Case"
            // e.g., "contextMenuTest" -> "Context Menu Test"
            // e.g., "runAppSuccessfulTest" -> "Run App Successful Test"
            return methodName.replaceAll(/([a-z])([A-Z])/, '$1 $2')
                    .split(' ')
                    .collect { word -> word.capitalize() }
                    .join(' ')
        }

        // Generate unified HTML for each test class
        testsByClass.each { className, tests ->
            def htmlFile = new File(reportDir, "${className}.html")
            if (htmlFile.exists()) {
                def htmlContent = htmlFile.text

                // Extract test durations from the HTML report
                // Look for test results in format: testMethodName passed (X.XXXs) or similar patterns
                def testDurations = [:]
                // Try multiple patterns to match different HTML report formats
                def patterns = [
                        /(\w+)\s+passed\s+\((\d+\.?\d*)s\)/,  // "contextMenuTest passed (12.885s)"
                        />(\w+)<\/td>\s*<td[^>]*>passed[^<]*<\/td>\s*<td[^>]*>\((\d+\.?\d*)s\)/,  // HTML table format
                        /"(\w+)"[^>]*>passed[^<]*\((\d+\.?\d*)s\)/  // JSON or other formats
                ]

                patterns.each { pattern ->
                    def matcher = htmlContent =~ pattern
                    matcher.each { match ->
                        def methodName = match[1]
                        def durationSeconds = match[2] as double
                        // Convert seconds to milliseconds
                        def durationMillis = (durationSeconds * 1000) as int
                        testDurations[methodName] = durationMillis
                    }
                }

                // Build unified test structure: test methods as top level, steps as children
                def unifiedTests = []
                tests.each { testMethodName, steps ->
                    // Default to formatted method name, but try to find test name from run()
                    def testName = formatMethodName(testMethodName)
                    def actualSteps = steps
                    def testDuration = ''

                    if (steps.size() > 0) {
                        def firstStep = steps[0]
                        def firstStepName = firstStep.name

                        // Check if first step looks like a test name from run()
                        // Test names typically: contain "Test", have spaces, start with capital
                        // Step names typically: are action verbs (open, verify, check, etc.)
                        def containsTest = firstStepName.toLowerCase().contains('test')
                        def looksLikeTestName = firstStepName != testMethodName &&
                                (containsTest ||
                                        (firstStepName.contains(' ') &&
                                                firstStepName.matches(/^[A-Z][a-zA-Z\s]+$/))) &&
                                !firstStepName.toLowerCase().startsWith('open') &&
                                !firstStepName.toLowerCase().startsWith('verify') &&
                                !firstStepName.toLowerCase().startsWith('check') &&
                                !firstStepName.toLowerCase().startsWith('click')

                        // If first step has children AND looks like a test name, use it
                        if (firstStep.children && firstStep.children.size() > 0 && looksLikeTestName) {
                            // First step is the test name from run(), use it as test name
                            // and use its children as the actual steps
                            testName = firstStepName
                            actualSteps = firstStep.children
                            testDuration = firstStep.duration ?: ''
                        }
                        // If first step looks like a test name but has no children, still use it
                        else if (looksLikeTestName) {
                            testName = firstStepName
                            actualSteps = steps
                            testDuration = firstStep.duration ?: ''
                        }
                        // Otherwise, use formatted method name (better than using a step name)
                    }

                    // Calculate overall test status
                    def testStatus = actualSteps.every { it.status == 'SUCCEED' } ? 'SUCCEED' :
                            actualSteps.any { it.status == 'FAILED' } ? 'FAILED' : 'RUNNING'

                    // Use duration from test report if available, otherwise calculate from steps
                    if (testDurations.containsKey(testMethodName)) {
                        // Use the duration from the test report (e.g., "12.885s" -> 12885 ms)
                        def reportDurationMillis = testDurations[testMethodName]
                        testDuration = TestReporter.formatDuration(reportDurationMillis)
                    } else {
                        // Fallback: calculate total duration recursively from all steps and substeps
                        def calculatedDuration = calculateTotalDuration(actualSteps)
                        if (calculatedDuration) {
                            testDuration = calculatedDuration
                        } else if (testDuration) {
                            // Format the duration if it's a string
                            def millis = TestReporter.parseDurationToMillis(testDuration)
                            testDuration = TestReporter.formatDuration(millis)
                        }
                    }

                    def testNode = [
                            name    : testName,
                            status  : testStatus,
                            duration: testDuration,
                            children: actualSteps
                    ]
                    unifiedTests.add(testNode)
                }

                // Copy screenshots to report directory before generating HTML
                def screenshotsDir = new File(reportDir, "screenshots")
                screenshotsDir.mkdirs()

                // Find adb executable
                def findAdb = {
                    def androidHome = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
                    if (androidHome) {
                        def adbPath = new File(androidHome, "platform-tools/adb${org.gradle.internal.os.OperatingSystem.current().isWindows() ? '.exe' : ''}")
                        if (adbPath.exists()) {
                            return adbPath.absolutePath
                        }
                    }
                    // Try common locations
                    def commonPaths = [
                            "${System.getProperty('user.home')}/AppData/Local/Android/Sdk/platform-tools/adb.exe",
                            "${System.getProperty('user.home')}/Library/Android/sdk/platform-tools/adb",
                            "${System.getProperty('user.home')}/Android/Sdk/platform-tools/adb"
                    ]
                    for (path in commonPaths) {
                        def adbFile = new File(path)
                        if (adbFile.exists()) {
                            return adbFile.absolutePath
                        }
                    }
                    return "adb" // Fallback to PATH
                }
                def adbPath = findAdb()

                def copyScreenshots
                copyScreenshots = { steps ->
                    steps.each { step ->
                        if (step.screenshot && step.screenshot != '') {
                            try {
                                def screenshotPath = step.screenshot
                                // Extract filename from path (handle both / and \ separators)
                                def screenshotFileName
                                if (screenshotPath.contains('/')) {
                                    screenshotFileName = screenshotPath.substring(screenshotPath.lastIndexOf('/') + 1)
                                } else if (screenshotPath.contains('\\')) {
                                    screenshotFileName = screenshotPath.substring(screenshotPath.lastIndexOf('\\') + 1)
                                } else {
                                    screenshotFileName = screenshotPath
                                }
                                def targetFile = new File(screenshotsDir, screenshotFileName)

                                // Check if screenshot is on device (starts with /storage or /sdcard)
                                if (screenshotPath.startsWith('/storage') || screenshotPath.startsWith('/sdcard')) {
                                    // Use adb pull to copy from device
                                    def adbCommand = "\"${adbPath}\" pull \"${screenshotPath}\" \"${targetFile.absolutePath}\""
                                    def process = adbCommand.execute()
                                    process.waitFor()
                                    if (process.exitValue() == 0 && targetFile.exists()) {
                                        // Update step.screenshot to the copied file path for HTML reference
                                        step.screenshot = screenshotFileName
                                    } else {
                                        println "Warning: Failed to pull screenshot ${screenshotPath}"
                                    }
                                } else {
                                    // Local file path
                                    def sourceFile = new File(screenshotPath)
                                    if (sourceFile.exists()) {
                                        sourceFile.withInputStream { input ->
                                            targetFile.withOutputStream { output ->
                                                output << input
                                            }
                                        }
                                        // Update step.screenshot to the copied file path for HTML reference
                                        step.screenshot = screenshotFileName
                                    }
                                }
                            } catch (Exception e) {
                                // Ignore screenshot copy errors
                                println "Warning: Error copying screenshot ${step.screenshot}: ${e.message}"
                            }
                        }
                        if (step.children && step.children.size() > 0) {
                            copyScreenshots(step.children)
                        }
                    }
                }
                copyScreenshots(unifiedTests)

                // Generate unified HTML table
                def containerId = "kaspresso-steps-unified"
                def stepsHtml = TestReporter.generateUnifiedStepsHtml(unifiedTests, containerId)

                // Remove any existing Kaspresso steps sections and insert new unified one
                htmlContent = htmlContent.replaceAll(/(?s)<div id="kaspresso-steps[^"]*">.*?<\/div>\s*<script>.*?<\/script>/, '')
                htmlContent = htmlContent.replace('<div id="footer">', stepsHtml + '<div id="footer">')
                htmlFile.text = htmlContent

                def totalSteps = unifiedTests.sum { countAllSteps([it]) }
                println "Enhanced ${htmlFile.name} with unified table containing ${tests.size()} tests and ${totalSteps} total steps"
            }
        }
    }
}

// Helper function to deduplicate steps
def deduplicateSteps(steps) {
    def seen = [] as Set
    def deduplicated = []
    
    steps.each { step ->
        def key = step.name
        if (!seen.contains(key)) {
            seen.add(key)
            if (step.children && step.children.size() > 0) {
                step.children = deduplicateSteps(step.children)
            }
            deduplicated.add(step)
        }
    }
    
    return deduplicated
}

// Helper function to count all steps
def countAllSteps(steps) {
    def count = 0
    steps.each { step ->
        count++
        if (step.children) {
            count += countAllSteps(step.children)
        }
    }
    return count
}


// Helper function to recursively calculate total duration including all nested steps
def calculateTotalDurationRecursive(step) {
    def totalMillis = 0
    
    // Add this step's duration
    if (step.duration) {
        def millis = TestReporter.parseDurationToMillis(step.duration)
        if (millis > 0) {
            totalMillis += millis
        }
    }
    
    // Recursively add all children's durations
    if (step.children && step.children.size() > 0) {
        step.children.each { child ->
            totalMillis += calculateTotalDurationRecursive(child)
        }
    }
    
    return totalMillis
}

// Helper function to calculate total duration for a test
def calculateTotalDuration(steps) {
    if (steps.isEmpty()) return ''
    
    // Recursively calculate total duration from all steps and their children
    def totalMillis = 0
    def hasValidDuration = false
    
    steps.each { step ->
        def stepMillis = calculateTotalDurationRecursive(step)
        if (stepMillis > 0) {
            totalMillis += stepMillis
            hasValidDuration = true
        }
    }
    
    if (hasValidDuration && totalMillis > 0) {
        return TestReporter.formatDuration(totalMillis)
    }
    
    return ''
}




// Configure Kotlin compiler options for all compilation tasks
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += ["-Xcontext-receivers"]
    }
}

// Make openTestReport run after connectedAndroidTest
afterEvaluate {
    tasks.matching { it.name.startsWith('connected') && it.name.endsWith('AndroidTest') }.configureEach {
        // Finalize with report tasks
        finalizedBy 'enhanceTestReport'
        finalizedBy 'openTestReport'
    }
}
