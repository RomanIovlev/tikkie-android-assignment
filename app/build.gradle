plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.abnamro.apps.referenceandroid'
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.abnamro.apps.referenceandroid"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xcontext-receivers"]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.2.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    
    // Kaspresso and Kakao for UI testing
    androidTestImplementation 'com.kaspersky.android-components:kaspresso:1.5.3'
    androidTestImplementation 'io.github.kakaocup:kakao:3.0.0'
}

// Task to open test report after tests complete
task openTestReport {
    group = 'verification'
    description = 'Opens the enhanced test report in browser'
    dependsOn 'enhanceTestReport'
    doLast {
        def reportFile = file("${project.buildDir}/reports/androidTests/connected/debug/index.html")
        if (reportFile.exists()) {
            println "Opening test report: ${reportFile.absolutePath}"
            if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                exec {
                    commandLine 'cmd', '/c', "start", reportFile.absolutePath
                }
            } else if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
                exec {
                    commandLine 'open', reportFile.absolutePath
                }
            } else {
                exec {
                    commandLine 'xdg-open', reportFile.absolutePath
                }
            }
        } else {
            println ""
            println "═══════════════════════════════════════════════════════════════"
            println "⚠️  Test report not found!"
            println "═══════════════════════════════════════════════════════════════"
            println ""
            println "Expected location: ${reportFile.absolutePath}"
            println ""
            println "To generate the report, run tests first:"
            println "  PowerShell: .\\gradlew.bat connectedDebugAndroidTest"
            println "  CMD:        gradlew.bat connectedDebugAndroidTest"
            println "  Linux/Mac:  ./gradlew connectedDebugAndroidTest"
            println ""
            println "Or run tests from Android Studio, then run this task again."
            println ""
        }
    }
}

// Combined task: enhance report and open it
task viewTestReport {
    group = 'verification'
    description = 'Enhances test report with Kaspresso steps and opens it in browser'
    dependsOn 'enhanceTestReport', 'openTestReport'
}

// Ensure tasks are visible in Android Studio
tasks.whenTaskAdded { task ->
    if (task.name in ['enhanceTestReport', 'openTestReport', 'viewTestReport']) {
        task.group = 'verification'
    }
}

// Task to enhance HTML report with Kaspresso step information
task enhanceTestReport {
    group = 'verification'
    description = 'Extracts Kaspresso steps from logs and adds them to HTML report'
    doLast {
        def reportDir = file("${project.buildDir}/reports/androidTests/connected/debug")
        def testResultsDir = file("${project.buildDir}/outputs/androidTest-results/connected/debug")
        
        // Map to collect all tests grouped by class: className -> [testMethodName -> steps]
        def testsByClass = [:]
        
        // Find logcat files and collect all test data
        testResultsDir.eachDir { deviceDir ->
            deviceDir.eachFileMatch(~/logcat-.*\.txt/) { logcatFile ->
                def logcatContent = logcatFile.text
                
                // Extract step information with hierarchy tracking
                def stepStack = []  // Stack to track nested steps
                def allSteps = []   // Flat list of all steps with hierarchy info
                
                logcatContent.eachLine { line ->
                    // Match start of step - more specific regex to avoid matching SUCCEED/FAILED lines
                    if (line.contains('TEST STEP:') && !line.contains('SUCCEED') && !line.contains('FAILED') && !line.contains('finished')) {
                        // Regex to capture the step name, optionally stripping existing "1. " or "1.1. " numbering
                        def stepMatch = line =~ /TEST STEP: "(?:\d+(?:\.\d+)*\.\s+)?(.+?)"/
                        if (stepMatch) {
                            def stepName = stepMatch[0][1]
                            def step = [
                                name: stepName,
                                status: 'RUNNING',
                                duration: '',
                                children: []
                            ]
                            
                            if (!stepStack.isEmpty()) {
                                stepStack.last().children.add(step)
                            } else {
                                allSteps.add(step)
                            }
                            stepStack.push(step)
                        }
                    } 
                    // Match end of step
                    else if (line.contains('SUCCEED') || line.contains('FAILED')) {
                        def status = line.contains('SUCCEED') ? 'SUCCEED' : 'FAILED'
                        def durationMatch = line =~ /(?:SUCCEED|FAILED)\. It took (.+?)\./
                        if (durationMatch && !stepStack.isEmpty()) {
                            def currentStep = stepStack.pop()
                            currentStep.status = status
                            currentStep.duration = durationMatch[0][1]
                        }
                    }
                }
                
                // Deduplicate steps (same name at same level)
                def deduplicatedSteps = deduplicateSteps(allSteps)
                
                // Store test data grouped by class
                if (deduplicatedSteps.size() > 0) {
                    def filenameMatch = logcatFile.name =~ /logcat-(.+?)-(.+?)\.txt/
                    if (filenameMatch) {
                        def className = filenameMatch[0][1]
                        def testMethodName = filenameMatch[0][2]
                        
                        if (!testsByClass.containsKey(className)) {
                            testsByClass[className] = [:]
                        }
                        testsByClass[className][testMethodName] = deduplicatedSteps
                    }
                }
            }
        }
        
        // Helper function to format method name to readable format
        def formatMethodName = { methodName ->
            // Convert camelCase to "Title Case"
            // e.g., "contextMenuTest" -> "Context Menu Test"
            // e.g., "runAppSuccessfulTest" -> "Run App Successful Test"
            return methodName.replaceAll(/([a-z])([A-Z])/, '$1 $2')
                           .split(' ')
                           .collect { word -> word.capitalize() }
                           .join(' ')
        }
        
        // Generate unified HTML for each test class
        testsByClass.each { className, tests ->
            def htmlFile = new File(reportDir, "${className}.html")
            if (htmlFile.exists()) {
                def htmlContent = htmlFile.text
                
                // Build unified test structure: test methods as top level, steps as children
                def unifiedTests = []
                tests.each { testMethodName, steps ->
                    // Default to formatted method name, but try to find test name from run()
                    def testName = formatMethodName(testMethodName)
                    def actualSteps = steps
                    def testDuration = ''
                    
                    if (steps.size() > 0) {
                        def firstStep = steps[0]
                        def firstStepName = firstStep.name
                        
                        // Check if first step looks like a test name from run()
                        // Test names typically: contain "Test", have spaces, start with capital
                        // Step names typically: are action verbs (open, verify, check, etc.)
                        def containsTest = firstStepName.toLowerCase().contains('test')
                        def looksLikeTestName = firstStepName != testMethodName && 
                                              (containsTest || 
                                               (firstStepName.contains(' ') && 
                                                firstStepName.matches(/^[A-Z][a-zA-Z\s]+$/))) &&
                                              !firstStepName.toLowerCase().startsWith('open') &&
                                              !firstStepName.toLowerCase().startsWith('verify') &&
                                              !firstStepName.toLowerCase().startsWith('check') &&
                                              !firstStepName.toLowerCase().startsWith('click')
                        
                        // If first step has children AND looks like a test name, use it
                        if (firstStep.children && firstStep.children.size() > 0 && looksLikeTestName) {
                            // First step is the test name from run(), use it as test name
                            // and use its children as the actual steps
                            testName = firstStepName
                            actualSteps = firstStep.children
                            testDuration = firstStep.duration ?: ''
                        } 
                        // If first step looks like a test name but has no children, still use it
                        else if (looksLikeTestName) {
                            testName = firstStepName
                            actualSteps = steps
                            testDuration = firstStep.duration ?: ''
                        }
                        // Otherwise, use formatted method name (better than using a step name)
                    }
                    
                    // Calculate overall test status and duration
                    def testStatus = actualSteps.every { it.status == 'SUCCEED' } ? 'SUCCEED' : 
                                     actualSteps.any { it.status == 'FAILED' } ? 'FAILED' : 'RUNNING'
                    
                    // Always calculate total duration recursively from all steps and substeps
                    // This ensures we get the full test duration even if the top-level step duration is missing
                    def calculatedDuration = calculateTotalDuration(actualSteps)
                    
                    // Use calculated duration if available, otherwise try to use the top-level step duration
                    if (calculatedDuration) {
                        testDuration = calculatedDuration
                    } else if (testDuration) {
                        // Format the duration if it's a string
                        def millis = parseDurationToMillis(testDuration)
                        testDuration = formatDuration(millis)
                    }
                    
                    def testNode = [
                        name: testName,
                        status: testStatus,
                        duration: testDuration,
                        children: actualSteps
                    ]
                    unifiedTests.add(testNode)
                }
                
                // Generate unified HTML table
                def containerId = "kaspresso-steps-unified"
                def stepsHtml = generateUnifiedStepsHtml(unifiedTests, containerId)
                
                // Remove any existing Kaspresso steps sections and insert new unified one
                htmlContent = htmlContent.replaceAll(/(?s)<div id="kaspresso-steps[^"]*">.*?<\/div>\s*<script>.*?<\/script>/, '')
                htmlContent = htmlContent.replace('<div id="footer">', stepsHtml + '<div id="footer">')
                htmlFile.text = htmlContent
                
                def totalSteps = unifiedTests.sum { countAllSteps([it]) }
                println "Enhanced ${htmlFile.name} with unified table containing ${tests.size()} tests and ${totalSteps} total steps"
            }
        }
    }
}

// Helper function to deduplicate steps
def deduplicateSteps(steps) {
    def seen = [] as Set
    def deduplicated = []
    
    steps.each { step ->
        def key = step.name
        if (!seen.contains(key)) {
            seen.add(key)
            if (step.children && step.children.size() > 0) {
                step.children = deduplicateSteps(step.children)
            }
            deduplicated.add(step)
        }
    }
    
    return deduplicated
}

// Helper function to count all steps
def countAllSteps(steps) {
    def count = 0
    steps.each { step ->
        count++
        if (step.children) {
            count += countAllSteps(step.children)
        }
    }
    return count
}

// Helper function to parse duration string to milliseconds
def parseDurationToMillis(durationString) {
    if (!durationString) return 0
    
    def totalMillis = 0
    def millisMatch = durationString =~ /(\d+)\s*millis?/
    def secondsMatch = durationString =~ /(\d+)\s*seconds?/
    def minutesMatch = durationString =~ /(\d+)\s*minutes?/
    
    if (millisMatch) {
        totalMillis += Integer.parseInt(millisMatch[0][1])
    }
    if (secondsMatch) {
        totalMillis += Integer.parseInt(secondsMatch[0][1]) * 1000
    }
    if (minutesMatch) {
        totalMillis += Integer.parseInt(minutesMatch[0][1]) * 60000
    }
    
    return totalMillis
}

// Helper function to format duration according to requirements
def formatDuration(millis) {
    if (millis <= 0) return ''
    
    def totalMillis = millis as int
    
    if (totalMillis >= 60000) {
        // >= 1 minute: "X min Y sec"
        def minutes = totalMillis / 60000 as int
        def seconds = (totalMillis % 60000) / 1000 as int
        return "${minutes} min ${seconds} sec"
    } else if (totalMillis >= 1000) {
        // >= 1 second but < 1 minute: "X sec"
        def seconds = totalMillis / 1000 as int
        return "${seconds} sec"
    } else {
        // < 1 second: "X ms"
        return "${totalMillis} ms"
    }
}

// Helper function to recursively calculate total duration including all nested steps
def calculateTotalDurationRecursive(step) {
    def totalMillis = 0
    
    // Add this step's duration
    if (step.duration) {
        def millis = parseDurationToMillis(step.duration)
        if (millis > 0) {
            totalMillis += millis
        }
    }
    
    // Recursively add all children's durations
    if (step.children && step.children.size() > 0) {
        step.children.each { child ->
            totalMillis += calculateTotalDurationRecursive(child)
        }
    }
    
    return totalMillis
}

// Helper function to calculate total duration for a test
def calculateTotalDuration(steps) {
    if (steps.isEmpty()) return ''
    
    // Recursively calculate total duration from all steps and their children
    def totalMillis = 0
    def hasValidDuration = false
    
    steps.each { step ->
        def stepMillis = calculateTotalDurationRecursive(step)
        if (stepMillis > 0) {
            totalMillis += stepMillis
            hasValidDuration = true
        }
    }
    
    if (hasValidDuration && totalMillis > 0) {
        return formatDuration(totalMillis)
    }
    
    return ''
}

// Helper function to generate unified HTML for all tests in a class
def generateUnifiedStepsHtml(tests, containerId = 'kaspresso-steps-unified', stepIdPrefix = 'test') {
    def html = """
<div id="${containerId}" style="margin: 20px 0; padding: 20px; background-color: #f9f9f9; border-radius: 5px;">
<h2 style="color: #333; margin-bottom: 15px;">Tests</h2>
<style>
.kaspresso-step-row {
    cursor: pointer;
    user-select: none;
}
.kaspresso-step-row:hover {
    background-color: #f0f0f0;
}
.kaspresso-step-content {
    display: none;
}
.kaspresso-step-content.expanded {
    display: table-row !important;
}
.kaspresso-toggle {
    display: inline-block;
    width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    margin-right: 8px;
    font-weight: bold;
    color: #666;
}
.kaspresso-toggle.expanded::before {
    content: '▼';
}
.kaspresso-toggle.collapsed::before {
    content: '▶';
}
.kaspresso-step-indent {
    display: inline-block;
    width: 20px;
}
.kaspresso-nested-row {
    background-color: #fafafa;
}
.kaspresso-test-row {
    background-color: #e8f5e9;
    font-weight: bold;
}
</style>
<table style="width: 100%; border-collapse: collapse; background-color: white;">
<thead>
<tr style="background-color: #4CAF50; color: white;">
<th style="padding: 12px; text-align: left; border: 1px solid #ddd; width: 60%;">Test / Step</th>
<th style="padding: 12px; text-align: left; border: 1px solid #ddd; width: 10%;">Status</th>
<th style="padding: 12px; text-align: left; border: 1px solid #ddd; width: 30%;">Duration</th>
</tr>
</thead>
<tbody id="${containerId}-body">
"""
    
    def stepCounter = [value: 0]
    html += generateStepRows(tests, stepIdPrefix, stepCounter, "", null, containerId, 'toggleStep')
    
    html += """
</tbody>
</table>
</div>
<script>
(function(containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;
    
    function toggleStep(stepId) {
        var toggle = container.querySelector('#toggle-' + stepId);
        if (!toggle) return;
        
        var isExpanded = toggle.classList.contains('expanded');
        var childRows = container.querySelectorAll('[data-parent="' + stepId + '"]');
        
        if (isExpanded) {
            childRows.forEach(function(row) {
                row.style.display = 'none';
                collapseAllDescendants(row, container);
            });
            toggle.classList.remove('expanded');
            toggle.classList.add('collapsed');
        } else {
            childRows.forEach(function(row) {
                row.style.display = 'table-row';
            });
            toggle.classList.remove('collapsed');
            toggle.classList.add('expanded');
        }
    }
    
    function collapseAllDescendants(parentRow, container) {
        var toggle = parentRow.querySelector('[id^="toggle-"]');
        if (toggle) {
            var nestedStepId = toggle.id.replace('toggle-', '');
            var nestedChildren = container.querySelectorAll('[data-parent="' + nestedStepId + '"]');
            nestedChildren.forEach(function(nested) {
                nested.style.display = 'none';
                collapseAllDescendants(nested, container);
            });
            toggle.classList.remove('expanded');
            toggle.classList.add('collapsed');
        }
    }
    
    // Use event delegation on the container
    container.addEventListener('click', function(e) {
        var row = e.target.closest('[data-step-id]');
        if (row) {
            var stepId = row.getAttribute('data-step-id');
            if (stepId) {
                toggleStep(stepId);
            }
        }
    });
})('${containerId}');
</script>
"""
    return html
}

