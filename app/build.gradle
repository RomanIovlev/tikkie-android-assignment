plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.abnamro.apps.referenceandroid'
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.abnamro.apps.referenceandroid"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        animationsDisabled = true
   }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'

    androidTestImplementation 'com.kaspersky.android-components:kaspresso:1.6.0'
    androidTestImplementation 'io.github.kakaocup:kakao:3.7.0'

    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}

tasks.register('openTestReport') {
    group = 'verification'
    description = 'Opens the enhanced test report in browser'
    dependsOn 'enhanceTestReport'
    doLast {
        def reportFile = file("${layout.buildDirectory.get()}/reports/androidTests/connected/debug/index.html")
        if (reportFile.exists()) {
            println "Opening test report: ${reportFile.absolutePath}"
            if (!BrowserOpener.openInBrowser(reportFile)) {
                println "Please open manually: ${reportFile.absolutePath}"
            }
        } else {
            BrowserOpener.printManualOpenInstructions(reportFile)
        }
    }
}

tasks.register('viewTestReport') {
    group = 'verification'
    description = 'Enhances test report with Kaspresso steps and opens it in browser'
    dependsOn 'enhanceTestReport', 'openTestReport'
}

tasks.configureEach { task ->
    if (task.name in ['enhanceTestReport', 'openTestReport', 'viewTestReport']) {
        task.group = 'verification'
    }
}

tasks.register('enhanceTestReport') {
    group = 'verification'
    description = 'Extracts Kaspresso steps from logs and adds them to HTML report'
    doLast {
        def reportDir = file("${layout.buildDirectory.get()}/reports/androidTests/connected/debug")
        def testResultsDir = file("${layout.buildDirectory.get()}/outputs/androidTest-results/connected/debug")
        def screenshotsDir = new File(reportDir, "screenshots")
        def adbPath = ScreenshotHandler.findAdbPath()
        def testsByClass = LogcatParser.parseLogcatFiles(testResultsDir)
        testsByClass.each { className, tests ->
            tests.each { testMethodName, steps ->
                tests[testMethodName] = StepProcessor.deduplicateSteps(steps)
            }
        }

        ReportEnhancer.enhanceReports(reportDir, testsByClass, screenshotsDir, adbPath)
    }
}

afterEvaluate {
    // Detect available devices
    def availableDevices = DeviceDetector.getAvailableDevices()
    def deviceCount = availableDevices.size()
    
    if (deviceCount == 0) {
        println "WARNING: No Android devices detected. Please connect a device or start an emulator."
        println "Run 'adb devices' to verify device connection."
    } else {
        println "Detected ${deviceCount} device(s): ${availableDevices.join(', ')}"
    }
    
    // Determine number of shards (use device count if available, otherwise use property or default)
    def numShards = project.findProperty('numShards')
    def shardCount = numShards ? numShards.toInteger() : (deviceCount > 0 ? Math.min(deviceCount, 4) : 4)
    
    // For single device, limit to 1 shard to avoid conflicts (unless explicitly requested)
    if (deviceCount == 1 && !numShards) {
        println "INFO: Single device detected. Using 1 shard to avoid conflicts."
        shardCount = 1
    } else if (deviceCount > 0 && shardCount > deviceCount) {
        println "WARNING: Requested ${shardCount} shards but only ${deviceCount} device(s) available. Using ${deviceCount} shards."
        shardCount = deviceCount
    }
    
    // Find the connectedDebugAndroidTest task
    def connectedTestTask = tasks.findByName('connectedDebugAndroidTest')
    
    if (connectedTestTask) {
        for (int i = 0; i < shardCount; i++) {
            def shardIndex = i
            def shardCountFinal = shardCount
            def deviceId = deviceCount > 0 ? availableDevices[shardIndex % deviceCount] : null
            
            // Create a task that configures and runs the test with specific shard parameters
            tasks.register("testShard${shardIndex}", org.gradle.api.tasks.Exec) {
                group = 'verification'
                description = deviceId ? 
                    "Runs test shard ${shardIndex} of ${shardCountFinal} on device ${deviceId}" :
                    "Runs test shard ${shardIndex} of ${shardCountFinal}"
                
                workingDir = project.rootDir
                
                def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
                def gradleCmd = isWindows ? 'gradlew.bat' : './gradlew'
                
                // Build the command with sharding parameters
                def commandArgs = [gradleCmd, 'connectedDebugAndroidTest',
                    "-Pandroid.testInstrumentationRunnerArguments.numShards=${shardCountFinal}",
                    "-Pandroid.testInstrumentationRunnerArguments.shardIndex=${shardIndex}"]
                
                commandLine = commandArgs
                
                // Set environment to use the same Java and target specific device
                environment = new HashMap(System.getenv())
                if (System.getProperty('java.home')) {
                    environment['JAVA_HOME'] = System.getProperty('java.home')
                }
                
                // Set ANDROID_SERIAL to target specific device for this shard
                if (deviceId) {
                    environment['ANDROID_SERIAL'] = deviceId
                }
                
                // Don't fail the build if this shard fails - we'll handle it in the main task
                ignoreExitValue = false
                
                doFirst {
                    println "============================================================"
                    if (deviceId) {
                        println "[Shard ${shardIndex}/${shardCountFinal - 1}] Starting on device: ${deviceId}"
                        // Verify device is still available
                        def currentDevices = DeviceDetector.getAvailableDevices()
                        if (!currentDevices.contains(deviceId)) {
                            throw new GradleException("Device ${deviceId} is no longer available. Please check device connection.")
                        }
                    } else {
                        println "[Shard ${shardIndex}/${shardCountFinal - 1}] Starting (no specific device assigned)"
                    }
                    println "============================================================"
                }
                
                doLast {
                    println "[Shard ${shardIndex}] Completed successfully"
                }
            }
        }
        
        // Main task that runs all shards
        tasks.register('runTestsInParallel') {
            group = 'verification'
            description = deviceCount > 1 ? 
                'Runs Android tests in parallel using test sharding across multiple devices. Usage: ./gradlew runTestsInParallel' :
                'Runs Android tests using test sharding (sequential execution). Usage: ./gradlew runTestsInParallel'
            
            // If multiple devices, run in parallel; otherwise run sequentially
            if (deviceCount > 1) {
                // Multiple devices: run shards in parallel
                (0..<shardCount).each { i ->
                    dependsOn "testShard${i}"
                }
            } else {
                // Single device: run shards sequentially to avoid conflicts
                // Force sequential execution by creating explicit dependencies
                (0..<shardCount).each { i ->
                    if (i == 0) {
                        dependsOn "testShard${i}"
                    } else {
                        def currentTask = tasks.named("testShard${i}")
                        def previousTask = tasks.named("testShard${i - 1}")
                        currentTask.configure { 
                            mustRunAfter previousTask
                        }
                        dependsOn currentTask
                    }
                }
            }
            
            finalizedBy 'enhanceTestReport'
        }
        
        // Force sequential execution for shard tasks when only one device is available
        if (deviceCount <= 1) {
            (0..<shardCount).each { i ->
                if (i > 0) {
                    tasks.named("testShard${i}").configure {
                        mustRunAfter tasks.named("testShard${i - 1}")
                    }
                }
            }
        }
    }
    
    tasks.matching { it.name.startsWith('connected') && it.name.endsWith('AndroidTest') }.configureEach {
        // Finalize with report tasks
        finalizedBy 'enhanceTestReport'
        finalizedBy 'openTestReport'
    }
}
